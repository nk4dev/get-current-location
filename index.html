<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Location</title>
  <link rel="stylesheet" href="index.css" />

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

  <!-- ol-mapbox-style（ネットワークタブで200になるURLを指定） -->
  <script src="https://cdn.jsdelivr.net/npm/ol-mapbox-style@12.3.1/dist/olms.js"></script>
</head>
<body>
  <p id="geodisp"></p>
  <div>
    <p id="geodispLat">...</p>
    <button id="copy-lat-btn" type="button">緯度をコピー</button>
  </div>
  <div>
    <p id="geodispLng">...</p>
    <button id="copy-lng-btn" type="button">経度をコピー</button>
  </div>
  <div id="map" style="width: 100%; height: 500px;"></div>

  <script src="index.js"></script>
</body>

</html>
